services:
  agent-node:
    build: .
    container_name: agent-node
    command: ["/bin/bash", "-c", "/app/mock_skill.sh && exec sleep infinity"]
    volumes:
      - ./mock_skill.sh:/app/mock_skill.sh:ro
      - ./fake_secrets.txt:/app/fake_secrets.txt:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.10

  web-lab:
    build: .
    container_name: web-lab
    command: ["python3", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/srv/web"]
    volumes:
      - ./web:/srv/web:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.40

  mock-c2:
    build: .
    container_name: mock-c2
    command: ["python3", "/app/c2.py"]
    volumes:
      - ./c2.py:/app/c2.py:ro
      - c2-data:/data
    networks:
      hw4net:
        ipv4_address: 172.30.0.66

volumes:
  c2-data:

networks:
  hw4net:
    name: hw4net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hw4
    ipam:
      config:
        - subnet: 172.30.0.0/24
